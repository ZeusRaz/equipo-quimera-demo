<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111317">
  <title>Equipo Quimera · Beta 1</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--red:#e52a37;--dark:#15171b;--muted:#717680;--bg:#f3f1ed;--card:#fff;--line:#e5e1dc;--green:#137a57;--blue:#2169d7;--amber:#a76500;--shadow:0 12px 36px rgba(25,22,18,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 18px;background:#111317;color:#fff;border-bottom:3px solid var(--red)}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--red);font-size:21px;font-weight:900}.brand strong,.brand small{display:block}.brand small{margin-top:2px;color:#adb1b7;font-size:10px;letter-spacing:.08em}.user{max-width:42%;overflow:hidden;color:#ccc;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.shell{width:min(100%,820px);margin:auto;padding:18px 14px 100px}.card{padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}.hero{padding:26px}.eyebrow{margin:0 0 8px;color:var(--red);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{margin-bottom:8px;font-size:clamp(29px,8vw,43px);line-height:1.04;letter-spacing:-.04em}h2{margin-bottom:0;font-size:22px}h3{margin-bottom:5px;font-size:17px}.muted{color:var(--muted)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:25px 3px 11px}.section-head span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat strong{display:block;font-size:27px}.stat small{color:var(--muted)}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:850}.btn.primary{width:100%;background:var(--red);color:#fff}.btn.blue{width:100%;background:var(--blue);color:#fff}.btn.dark{background:#282b31;color:#fff}.btn.light{border:1px solid var(--line);background:#fff;color:var(--dark)}.btn.danger{background:var(--red);color:#fff}.btn.success{background:var(--green);color:#fff}.btn:disabled{cursor:not-allowed;opacity:.45}.list{overflow:hidden;padding:0}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row strong,.row small{display:block}.row small{margin-top:4px;color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:6px 9px;background:#efefed;color:#60646c;font-size:9px;font-weight:900;text-transform:uppercase}.tag.green{background:#e5f4ee;color:var(--green)}.tag.red{background:#fde8e9;color:#b3202b}.tag.blue{background:#e5eefc;color:#1859b5}.tag.amber{background:#fff0d7;color:var(--amber)}.empty{padding:34px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:5px;color:var(--dark)}label{display:block;margin-top:14px;font-size:12px;font-weight:800}input,select,textarea{width:100%;margin-top:6px;padding:13px;border:1px solid #d6d2cc;border-radius:11px;background:#fff;color:var(--dark);outline:none}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,42,55,.1)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;margin-top:18px}.actions .btn{flex:1}.back{border:0;margin:0 0 15px;padding:5px 0;background:none;color:var(--muted);font-weight:800}.members{margin-top:10px;border:1px solid var(--line);border-radius:12px}.member{display:grid;grid-template-columns:auto 1fr 130px;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--line)}.member:last-child{border-bottom:0}.member input{width:auto;margin:0}.member select{margin:0;padding:9px}.meta{margin:8px 0 0;color:var(--muted);line-height:1.5}.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.date{padding:12px;border-radius:12px;background:#f5f3f0}.date small,.date strong{display:block}.date small{margin-bottom:4px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em}.progress{height:8px;margin:14px 0;border-radius:999px;background:#ebe8e3;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.scanbox{margin-top:13px}.manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.manual input{margin:0}.manual .btn{padding-inline:20px}#reader{margin-top:12px;overflow:hidden;border-radius:13px;background:#111}.message{margin-top:11px;padding:11px 12px;border-radius:10px;background:#e5f4ee;color:#126846;font-size:12px}.message.error{background:#fde8e9;color:#ad202a}.equip-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.equip-row:last-child{border-bottom:0}.icon{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e5f4ee;color:var(--green);font-weight:900}.equip-row strong,.equip-row small{display:block}.equip-row small{margin-top:3px;color:var(--muted);font-size:11px}.mini-actions{display:flex;gap:6px}.mini{border:0;border-radius:9px;padding:9px 10px;font-size:10px;font-weight:900}.mini.red{background:var(--red);color:#fff}.mini.gray{background:#eee;color:#333}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid #ddd;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.navbtn{border:0;padding:6px 2px;background:none;color:#777;font-size:9px;font-weight:800}.navbtn span{display:block;margin-bottom:3px;font-size:20px}.navbtn.active{color:var(--red)}.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:end center;background:rgba(0,0,0,.55)}.sheet{width:min(100%,820px);max-height:88vh;overflow:auto;padding:22px 18px calc(25px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}.sheet-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;border-radius:9px;padding:8px 10px;background:#eee;font-weight:800}.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px}.login .card{width:min(100%,430px);text-align:center}.login .logo{margin:0 auto 17px;width:58px;height:58px;font-size:31px}.login p{color:var(--muted);line-height:1.5}#googleButton{display:flex;justify-content:center;margin-top:20px}.loader{display:grid;place-items:center;min-height:55vh;color:var(--muted)}.spinner{width:34px;height:34px;margin-bottom:12px;border:4px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.two{grid-template-columns:1fr}.member{grid-template-columns:auto 1fr}.member select{grid-column:2}.hero{padding:23px 19px}.card{padding:18px}.user{display:none}.row{padding:14px}.equip-row{padding:13px 11px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="logo">Q</span><span><strong>Equipo Quimera</strong><small>BETA 1 · CONTROL DE PRODUCCIÓN</small></span></div><span class="user" id="userLabel"></span></header>
  <section id="loginView" class="login"><div class="card"><div class="logo">Q</div><p class="eyebrow">ACCESO RESTRINGIDO</p><h1>Equipo Quimera</h1><p>Inicia sesión con un correo registrado en la pestaña <b>USUARIOS</b>.</p><div id="googleButton"></div><div id="loginMessage" class="message error hidden"></div></div></section>
  <main id="app" class="shell hidden"><div id="view"></div></main>
  <nav id="nav" class="bottomnav hidden">
    <button class="navbtn active" data-view="home" onclick="navigate('home')"><span>⌂</span>Inicio</button>
    <button class="navbtn" data-view="productions" onclick="navigate('productions')"><span>▣</span>Producciones</button>
    <button class="navbtn" data-view="inventory" onclick="navigate('inventory')"><span>⌕</span>Inventario</button>
    <button class="navbtn" data-view="incidents" onclick="navigate('incidents')"><span>!</span>Incidencias</button>
    <button class="navbtn" data-view="history" onclick="navigate('history')"><span>↶</span>Historial</button>
  </nav>
  <div id="modal" class="overlay hidden"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">Cerrar</button></div><div id="modalBody"></div></div></div>
  <iframe name="apiFrame" id="apiFrame" class="hidden"></iframe>
  <script>
    const CONFIG={
      API:'https://script.google.com/macros/s/AKfycbzgsnFdU-1zqTpU3O_5kUUyM-cVVBWgzYS-6aMPVOGu1GcLCWGcAFcwOkRTgfvpFmgPTA/exec',
      CLIENT_ID:'296686834169-gsadmi2mklm1tplf4acpf41s81chag6k.apps.googleusercontent.com'
    };
    const S={token:'',data:null,detail:null,view:'home',scanner:null,scanning:false,pending:new Map()};
    const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    window.addEventListener('load',()=>{const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({client_id:CONFIG.CLIENT_ID,callback:onGoogle,ux_mode:'popup'});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',locale:'es',width:300});}},150)});
    async function onGoogle(response){S.token=response.credential;showLoading();try{S.data=await api('bootstrap',{});$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('userLabel').textContent=S.data.user.name+' · '+S.data.user.permission;navigate('home');}catch(e){S.token='';$('loginView').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden');loginError(e.message);}}
    function api(action,payload){return new Promise((resolve,reject)=>{const requestId='r'+Date.now()+Math.random().toString(16).slice(2),callback='quimeraCallback_'+requestId,script=document.createElement('script');const cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove()};window[callback]=msg=>{cleanup();msg.ok?resolve(msg.data):reject(new Error(msg.error||'Error del servidor'))};const params=new URLSearchParams({action,token:S.token,payload:JSON.stringify(payload),requestId,callback});script.src=CONFIG.API+'?'+params.toString();script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con el servidor.'))};const timer=setTimeout(()=>{cleanup();reject(new Error('El servidor tardó demasiado. Intenta nuevamente.'))},30000);document.body.appendChild(script)});}
    function showLoading(){if(!$('loginView').classList.contains('hidden'))return;$('view').innerHTML='<div class="loader"><div><div class="spinner"></div>Cargando información…</div></div>';}
    function loginError(text){$('loginMessage').textContent=text;$('loginMessage').classList.remove('hidden')}
    function navigate(view){stopScanner();S.view=view;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));({home:renderHome,productions:renderProductions,inventory:renderInventory,incidents:renderIncidents,history:renderHistory}[view]||renderHome)();window.scrollTo(0,0)}
    function renderHome(){const d=S.data,active=d.activeProductions||[],available=(d.inventory||[]).filter(i=>state(i.Estado)==='DISPONIBLE').length,out=(d.inventory||[]).filter(i=>['EN_PRODUCCION','PREPARANDO_SALIDA','REVISION_LOCACION'].includes(state(i.Estado))).length;$('view').innerHTML=`<section class="card hero"><p class="eyebrow">PANEL GENERAL</p><h1>Control de equipo,<br>${esc(firstName(d.user.name))}.</h1><p class="muted">Revisa las producciones activas, devoluciones e incidencias.</p><button class="btn primary" onclick="openCreate()">＋ Nueva producción</button></section><div class="section-head"><h2>Resumen</h2></div><div class="grid"><div class="stat"><strong>${active.length}</strong><small>Producciones activas</small></div><div class="stat"><strong>${available}</strong><small>Equipos disponibles</small></div><div class="stat"><strong>${out}</strong><small>Fuera de bodega</small></div><div class="stat"><strong>${(d.openIncidents||[]).length}</strong><small>Incidencias abiertas</small></div></div><div class="section-head"><h2>Producciones activas</h2><span onclick="navigate('productions')">Ver todas</span></div>${productionList(active)}`}
    function renderProductions(){$('view').innerHTML=`<section class="card hero"><p class="eyebrow">PRODUCCIONES</p><h1>Salidas activas</h1><p class="muted">Preparación, revisión en locación y regreso a bodega.</p><button class="btn primary" onclick="openCreate()">＋ Nueva producción</button></section><div class="section-head"><h2>Activas</h2><span>${S.data.activeProductions.length}</span></div>${productionList(S.data.activeProductions)}`}
    function productionList(items){return items.length?`<div class="card list">${items.map(p=>`<div class="row" onclick="openProduction('${esc(p.IDProduccion)}')"><div class="row-main"><strong>${esc(p.Nombre)}</strong><small>${esc(p.Folio)} · ${esc(p.Cliente||'Sin cliente')} · ${esc(p.FechaRegreso)}</small></div>${tag(p.Estado)}</div>`).join('')}</div>`:`<div class="card empty"><strong>No hay registros</strong>Crea una producción para comenzar.</div>`}
    function renderInventory(){$('view').innerHTML=`<section class="card"><p class="eyebrow">INVENTARIO</p><h1>Equipo</h1><input id="inventorySearch" type="search" autocomplete="off" placeholder="Buscar ID, equipo, marca o modelo" oninput="filterInventory(this.value)"></section><div class="section-head"><h2>Resultados</h2><span id="inventoryCount">0</span></div><div id="inventoryList" class="card list"></div>`;filterInventory('')}
    function filterInventory(filter){const term=String(filter||'').trim().toLowerCase(),items=(S.data.inventory||[]).filter(i=>(i.ID+' '+i.Equipo+' '+i.Marca+' '+i.Modelo+' '+i.Categoria).toLowerCase().includes(term));$('inventoryCount').textContent=items.length;$('inventoryList').innerHTML=items.map(i=>`<div class="row"><div class="row-main"><strong>${esc(i.ID)} · ${esc(i.Equipo)}</strong><small>${esc([i.Marca,i.Modelo,i.Condicion].filter(Boolean).join(' · '))}</small></div>${tag(i.Estado)}</div>`).join('')||'<div class="empty">No se encontró equipo.</div>'}
    function renderIncidents(){const items=S.data.openIncidents||[];$('view').innerHTML=`<section class="card hero"><p class="eyebrow">INCIDENCIAS</p><h1>Seguimiento</h1><p class="muted">Equipo faltante, dañado, incompleto o en mantenimiento.</p></section><div class="section-head"><h2>Abiertas</h2><span>${items.length}</span></div><div class="card list">${items.map(i=>`<div class="row"><div class="row-main"><strong>${esc(i.IDEquipo)} · ${esc(i.TipoIncidencia)}</strong><small>${esc(i.Descripcion||'Sin descripción')} · ${esc(i.FechaHora)}</small></div>${tag(i.EstadoIncidencia)}</div>`).join('')||'<div class="empty"><strong>Sin incidencias abiertas</strong>Todo se encuentra en orden.</div>'}</div>`}
    function renderHistory(){$('view').innerHTML=`<section class="card hero"><p class="eyebrow">HISTORIAL</p><h1>Producciones cerradas</h1><p class="muted">Consulta responsables, integrantes, equipo e incidencias.</p></section><div class="section-head"><h2>Finalizadas</h2><span>${S.data.history.length}</span></div>${productionList(S.data.history)}`}
    function openCreate(){const people=S.data.people||[];openModal('Nueva producción',`<form onsubmit="createProduction(event)"><label>Nombre de la producción<input id="pName" required placeholder="Ej. Dreams Cozumel"></label><label>Cliente<input id="pClient" placeholder="Ej. Hotel Dreams"></label><label>Locación<input id="pLocation" placeholder="Ej. Cozumel"></label><label>Responsable del equipo<input id="pResponsible" required placeholder="Nombre completo"></label><div class="two"><label>Fecha de salida<input id="pDeparture" type="date" required></label><label>Fecha de regreso<input id="pReturn" type="date" required></label></div><label>Integrantes opcionales</label><div class="members">${people.map((p,n)=>`<div class="member"><input type="checkbox" id="m${n}" data-id="${esc(p.IDPersonal)}" data-name="${esc(p.Nombre)}" data-type="${esc(p.Tipo)}"><label for="m${n}" style="margin:0">${esc(p.Nombre)}<small class="muted">${esc(p.RolPrincipal||'')}</small></label><select id="r${n}">${roles(p.RolPrincipal)}</select></div>`).join('')||'<div class="empty">No hay personal registrado.</div>'}</div><label>Notas<textarea id="pNotes" placeholder="Indicaciones generales"></textarea></label><button class="btn primary" id="createBtn" style="margin-top:18px">Crear producción</button></form>`)}
    async function createProduction(e){e.preventDefault();const button=$('createBtn');button.disabled=true;const members=[...document.querySelectorAll('.member input:checked')].map(box=>{const n=box.id.slice(1);return{idPersonal:box.dataset.id,name:box.dataset.name,type:box.dataset.type,role:$('r'+n).value}});try{const detail=await api('createProduction',{name:$('pName').value,client:$('pClient').value,location:$('pLocation').value,responsible:$('pResponsible').value,departureDate:$('pDeparture').value,returnDate:$('pReturn').value,notes:$('pNotes').value,members});closeModal();await refresh();openProduction(detail.production.IDProduccion);}catch(err){alert(err.message);button.disabled=false}}
    async function refresh(){S.data=await api('bootstrap',{});}
    async function openProduction(id){showLoading();try{S.detail=await api('productionDetail',{idProduction:id});renderProductionDetail();window.scrollTo(0,0)}catch(e){alert(e.message);navigate('productions')}}
    function renderProductionDetail(){const d=S.detail,p=d.production,equipment=d.equipment||[],st=state(p.Estado);const counts=stageCounts(st,equipment);$('view').innerHTML=`<button class="back" onclick="navigate('${['FINALIZADA','CANCELADA'].includes(st)?'history':'productions'}')">← Volver</button><section class="card"><p class="eyebrow">${esc(p.Folio)} · ${labelState(p.Estado)}</p><h1>${esc(p.Nombre)}</h1><p class="meta">${esc(p.Cliente||'Sin cliente')} · ${esc(p.Locacion||'Sin locación')}<br>Responsable: ${esc(p.Responsable)}</p><div class="dates"><div class="date"><small>SALIDA</small><strong>${esc(p.FechaSalida)}</strong></div><div class="date"><small>REGRESO</small><strong>${esc(p.FechaRegreso)}</strong></div></div></section>${membersCard(d.members)}${stageCard(st,counts,equipment)}<div class="section-head"><h2>Equipo</h2><span>${equipment.length}</span></div><div class="card list">${equipmentRows(st,equipment)}</div>${d.incidents.length?`<div class="section-head"><h2>Incidencias</h2><span>${d.incidents.length}</span></div><div class="card list">${d.incidents.map(i=>`<div class="row"><div><strong>${esc(i.IDEquipo)} · ${esc(i.TipoIncidencia)}</strong><small>${esc(i.Descripcion)}</small></div>${tag(i.EstadoIncidencia)}</div>`).join('')}</div>`:''}`}
    function membersCard(members){return members?.length?`<div class="section-head"><h2>Integrantes</h2><span>${members.length}</span></div><div class="card list">${members.map(m=>`<div class="row"><div><strong>${esc(m.Nombre)}</strong><small>${esc(m.Rol)} · ${esc(m.Tipo)}</small></div></div>`).join('')}</div>`:''}
    function stageCard(st,c,equipment){if(st==='FINALIZADA')return`<section class="card scanbox"><h2>Producción finalizada</h2><p class="meta">Este registro se conserva en el historial.</p></section>`;let title='Preparación de salida',text='Escanea el equipo y confirma su condición antes de salir.',button='';if(st==='PREPARACION')button=`<button class="btn success" onclick="confirmDeparture()" ${equipment.length?'':'disabled'}>Confirmar salida</button>`;if(st==='EN_PRODUCCION'){title='Equipo en producción';text='Cuando estén guardando en locación, comienza la revisión.';button=`<button class="btn primary" onclick="startLocationReview()">Comenzar revisión en locación</button>`}if(st==='REVISION_LOCACION'){title='Revisión en locación';text=`${c.done} de ${c.total} equipos encontrados.`;button=`<button class="btn primary" onclick="startWarehouseReturn()">Continuar a regreso de bodega</button>`}if(st==='REGRESO_BODEGA'){title='Regreso a bodega';text=`${c.done} de ${c.total} equipos confirmados.`;button=`<button class="btn success" onclick="finalizeProduction()" ${c.done===c.total?'':'disabled'}>Finalizar producción</button>`}return`<section class="card scanbox"><h2>${title}</h2><p class="meta">${text}</p>${c.total?`<div class="progress"><span style="width:${Math.round(c.done/c.total*100)}%"></span></div>`:''}${['PREPARACION','REVISION_LOCACION','REGRESO_BODEGA'].includes(st)?`<button id="scanBtn" class="btn blue" onclick="toggleScanner()">▣ Abrir escáner QR</button><div id="reader" class="hidden"></div><div class="manual"><input id="manualCode" placeholder="Código manual: CAM-001"><button class="btn dark" onclick="manualScan()">Agregar</button></div><div id="scanMessage" class="message hidden"></div>`:''}<div class="actions">${button}</div></section>`}
    function equipmentRows(st,items){return items.length?items.map(x=>{const r=x.record,i=x.item,status=equipmentStageStatus(st,r);return`<div class="equip-row"><span class="icon">${status.done?'✓':'·'}</span><div><strong>${esc(r.IDEquipo)} · ${esc(i.Equipo||'')}</strong><small>${esc([i.Marca,i.Modelo,status.text].filter(Boolean).join(' · '))}</small></div><div class="mini-actions">${st==='PREPARACION'?`<button class="mini red" onclick="removeEquipment('${esc(r.IDEquipo)}')">Quitar</button>`:`<button class="mini gray" onclick="openIncident('${esc(r.IDEquipo)}')">Incidencia</button>`}</div></div>`}).join(''):'<div class="empty"><strong>Sin equipo</strong>Escanea la primera pieza.</div>'}
    function stageCounts(st,items){return{total:items.length,done:items.filter(x=>equipmentStageStatus(st,x.record).done).length}}
    function equipmentStageStatus(st,r){if(st==='PREPARACION')return{done:true,text:r.CondicionSalida||'Registrado'};if(st==='REVISION_LOCACION')return{done:!!r.CondicionLocacion,text:r.CondicionLocacion?'Revisado: '+r.CondicionLocacion:'Pendiente'};if(st==='REGRESO_BODEGA'||st==='FINALIZADA')return{done:['DEVUELTO','MANTENIMIENTO','FALTANTE'].includes(state(r.EstadoEquipo)),text:r.CondicionRegreso||r.EstadoEquipo};return{done:true,text:r.EstadoEquipo}}
    async function handleCode(code){code=String(code||'').trim().toUpperCase();if(!code)return;const st=state(S.detail.production.Estado);if(st==='PREPARACION')return conditionDialog(code,'addEquipment','Condición antes de salir');if(st==='REVISION_LOCACION')return conditionDialog(code,'reviewEquipment','Condición en locación');if(st==='REGRESO_BODEGA')return conditionDialog(code,'returnEquipment','Condición al regresar a bodega')}
    function conditionDialog(code,action,title){const item=(S.data.inventory||[]).find(i=>String(i.ID).toUpperCase()===code),current=item?.Condicion||'Buena';openModal(title,`<p><b>${esc(code)}</b> · ${esc(item?.Equipo||'')}</p><label>Condición<select id="condition"><option ${current==='Nueva'?'selected':''}>Nueva</option><option ${current==='Buena'?'selected':''}>Buena</option><option ${current==='Con detalles'?'selected':''}>Con detalles</option><option ${current==='Dañada'?'selected':''}>Dañada</option><option ${current==='Incompleta'?'selected':''}>Incompleta</option></select></label><label>Nota opcional<textarea id="conditionNotes"></textarea></label>${action!=='addEquipment'?'<label><input id="maintenance" type="checkbox" style="width:auto;margin-right:7px">Enviar a mantenimiento</label>':''}<button class="btn primary" style="margin-top:18px" onclick="submitCondition('${esc(code)}','${action}')">Confirmar</button>`)}
    async function submitCondition(code,action){const payload={idProduction:S.detail.production.IDProduccion,idEquipment:code,condition:$('condition').value,notes:$('conditionNotes').value,maintenance:$('maintenance')?.checked||false};closeModal();showScanMessage('Registrando…');try{S.detail=await api(action,payload);renderProductionDetail();if(navigator.vibrate)navigator.vibrate(100)}catch(e){alert(e.message);renderProductionDetail()}}
    async function removeEquipment(id){if(!confirm('¿Quitar '+id+' de esta producción?'))return;try{S.detail=await api('removeEquipment',{idProduction:S.detail.production.IDProduccion,idEquipment:id});renderProductionDetail()}catch(e){alert(e.message)}}
    async function confirmDeparture(){if(!confirm('¿Confirmar la salida? Después ya no podrás quitar equipo de la lista.'))return;await productionAction('confirmDeparture')}
    async function startLocationReview(){if(!confirm('Comenzarás la revisión antes de abandonar la locación.'))return;await productionAction('startLocationReview')}
    async function startWarehouseReturn(){const c=stageCounts('REVISION_LOCACION',S.detail.equipment);if(c.done<c.total&&!confirm(`Todavía faltan ${c.total-c.done} equipos por revisar. ¿Continuar de todos modos?`))return;await productionAction('startWarehouseReturn')}
    async function finalizeProduction(){if(!confirm('¿Finalizar y enviar esta producción al historial?'))return;await productionAction('finalizeProduction')}
    async function productionAction(action){showLoading();try{S.detail=await api(action,{idProduction:S.detail.production.IDProduccion});await refresh();renderProductionDetail()}catch(e){alert(e.message);renderProductionDetail()}}
    function openIncident(id){openModal('Reportar incidencia',`<p><b>${esc(id)}</b></p><label>Tipo<select id="incidentType"><option>Golpe o caída</option><option>Arena o humedad</option><option>Falla técnica</option><option>Accesorio faltante</option><option>Daño estético</option><option>Sobrecalentamiento</option><option>Otro</option></select></label><label>Condición actual<select id="incidentCondition"><option>Buena</option><option selected>Con detalles</option><option>Dañada</option><option>Incompleta</option></select></label><label>Descripción<textarea id="incidentNotes" required></textarea></label><label><input id="incidentMaintenance" type="checkbox" style="width:auto;margin-right:7px">Requiere mantenimiento</label><button class="btn danger" style="width:100%;margin-top:18px" onclick="submitIncident('${esc(id)}')">Guardar incidencia</button>`)}
    async function submitIncident(id){try{S.detail=await api('createIncident',{idProduction:S.detail.production.IDProduccion,idEquipment:id,incidentType:$('incidentType').value,condition:$('incidentCondition').value,notes:$('incidentNotes').value,maintenance:$('incidentMaintenance').checked,stage:S.detail.production.Estado});closeModal();await refresh();renderProductionDetail()}catch(e){alert(e.message)}}
    function manualScan(){const input=$('manualCode');handleCode(input.value);input.value=''}
    async function toggleScanner(){S.scanning?stopScanner():startScanner()}
    async function startScanner(){const reader=$('reader');reader.classList.remove('hidden');S.scanner=new Html5Qrcode('reader');try{await S.scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},text=>{if(S.scanning){stopScanner();handleCode(text)}},()=>{});S.scanning=true;$('scanBtn').textContent='Cerrar cámara'}catch(e){reader.classList.add('hidden');showScanMessage('No se pudo abrir la cámara. Revisa el permiso.',true)}}
    async function stopScanner(){if(S.scanner){try{await S.scanner.stop();S.scanner.clear()}catch(e){}S.scanner=null}S.scanning=false;if($('reader'))$('reader').classList.add('hidden');if($('scanBtn'))$('scanBtn').textContent='▣ Abrir escáner QR'}
    function showScanMessage(text,error=false){if(!$('scanMessage'))return;$('scanMessage').textContent=text;$('scanMessage').className='message'+(error?' error':'')}
    function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}
    function roles(selected){return['Producción','Dirección','Cámara','Foto','Asistencia','Drone','Iluminación','Audio','Arte','Otro'].map(r=>`<option ${r===selected?'selected':''}>${r}</option>`).join('')}
    function tag(value){const st=state(value),color=st.includes('DISPONIBLE')||st.includes('FINALIZADA')?'green':st.includes('MANTENIMIENTO')||st.includes('FALTANTE')||st.includes('INCIDENCIA')?'red':st.includes('PREPARACION')||st.includes('REVISION')?'amber':'blue';return`<span class="tag ${color}">${esc(labelState(value))}</span>`}
    function state(v){return String(v||'').trim().toUpperCase().replace(/\s+/g,'_').replace(/Ó/g,'O')}
    function labelState(v){return String(v||'').replace(/_/g,' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}
    function firstName(v){return String(v||'').trim().split(/\s+/)[0]||'equipo'}
  </script>
</body>
</html>
