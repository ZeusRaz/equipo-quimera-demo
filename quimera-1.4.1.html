n-top:10px;border:1px solid var(--line);border-radius:12px}.member{display:grid;grid-template-columns:auto 1fr 120px 130px;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--line)}.member:last-child{border-bottom:0}.member input{width:auto;margin:0}.member select{margin:0;padding:9px}.condition-item{padding:14px;border-bottom:1px solid var(--line)}.condition-item:last-child{border-bottom:0}.condition-item strong,.condition-item small{display:block}.condition-item small{margin-top:3px;color:var(--muted)}.condition-item textarea{min-height:60px}.meta{margin:8px 0 0;color:var(--muted);line-height:1.5}.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.date{padding:12px;border-radius:12px;background:#f5f3f0}.date small,.date strong{display:block}.date small{margin-bottom:4px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em}.progress{height:8px;margin:14px 0;border-radius:999px;background:#ebe8e3;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.scanbox{margin-top:13px}.manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.manual input{margin:0}.manual .btn{padding-inline:20px}#reader{margin-top:12px;overflow:hidden;border-radius:13px;background:#111}.message{margin-top:11px;padding:11px 12px;border-radius:10px;background:#e5f4ee;color:#126846;font-size:12px}.message.error{background:#fde8e9;color:#ad202a}.equip-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.equip-row:last-child{border-bottom:0}.icon{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e5f4ee;color:var(--green);font-weight:900}.equip-row strong,.equip-row small{display:block}.equip-row small{margin-top:3px;color:var(--muted);font-size:11px}.mini-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{border:0;border-radius:9px;padding:9px 10px;font-size:10px;font-weight:900}.mini.red{background:var(--red);color:#fff}.mini.gray{background:#eee;color:#333}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);padding:7px max(4px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));border-top:1px solid #ddd;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.navbtn{border:0;padding:6px 1px;background:none;color:#777;font-size:8px;font-weight:800}.navbtn span{display:block;margin-bottom:3px;font-size:18px}.navbtn.active{color:var(--red)}.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:end center;background:rgba(0,0,0,.55)}.sheet{width:min(100%,820px);max-height:88vh;overflow:auto;padding:22px 18px calc(25px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}.sheet-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;border-radius:9px;padding:8px 10px;background:#eee;font-weight:800}.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px}.login .card{width:min(100%,430px);text-align:center}.login .logo{margin:0 auto 17px;width:58px;height:58px;font-size:31px}.login p{color:var(--muted);line-height:1.5}#googleButton{display:flex;justify-content:center;margin-top:20px}.loader{display:grid;place-items:center;min-height:55vh;color:var(--muted)}.spinner{width:34px;height:34px;margin-bottom:12px;border:4px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.two{grid-template-columns:1fr}.member{grid-template-columns:auto 1fr}.member select{grid-column:2}.hero{padding:23px 19px}.card{padding:18px}.user{display:none}.topbar{padding:0 10px}.top-action{padding:7px;font-size:10px}.row{padding:14px}.equip-row{padding:13px 11px}}
    html{touch-action:manipulation}body{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}.row,.equip-row{content-visibility:auto;contain-intrinsic-size:64px}.area-grid{display:grid;gap:8px;margin-top:14px}.area-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf9f7}.area-row strong,.area-row small{display:block}.area-row small{margin-top:3px;color:var(--muted)}.area-controls{display:flex;gap:7px;align-items:center}.area-filter{margin:0;width:auto;min-width:130px;padding:9px}.sync-note{margin-top:10px;color:var(--muted);font-size:11px}.member-area{grid-column:2;margin-top:0!important}.mini.green{background:var(--green);color:#fff}
    /* Tema Quimera oscuro */
    :root{--dark:#f7f7f5;--muted:#a9adb5;--bg:#090a0c;--card:#14161a;--line:#292c32;--shadow:0 14px 40px rgba(0,0,0,.28)}
    body{background:var(--bg);color:var(--dark)}.topbar{background:#050506;border-bottom-color:var(--red)}.brand-logo{display:block;width:128px;height:34px;object-fit:contain;object-position:left center}.brand>span:last-child{display:none}.login-logo{display:block;width:min(100%,270px);height:auto;margin:0 auto 23px}.card,.stat,.sheet{background:var(--card);border-color:var(--line)}.stat small,.muted,.section-head span,.row small,.equip-row small,.area-row small,.sync-note,.meta{color:var(--muted)}.row,.equip-row,.condition-item,.member{border-color:var(--line)}input,select,textarea{border-color:#343840;background:#0d0f12;color:#f7f7f5;color-scheme:dark}input::placeholder,textarea::placeholder{color:#737982}.btn.light{border-color:#393d45;background:#202329;color:#f7f7f5}.mini.gray,.close{background:#292c32;color:#f7f7f5}.tag{background:#272a30;color:#c5c9d0}.date{background:#202329}.progress{background:#292c32}.manual input{background:#0d0f12}.bottomnav{border-color:#292c32;background:rgba(12,13,16,.96)}.navbtn{color:#969ba4}.navbtn.active{color:#ff4350}.overlay{background:rgba(0,0,0,.78)}.area-row{border-color:var(--line);background:#191b20}.members{border-color:var(--line)}details{border-top:1px solid var(--line);padding-top:14px}.login .card{background:#111317}.login h1{font-size:34px}.login .eyebrow{margin-top:0}

<body>
  <header class="topbar"><div class="brand"><img class="brand-logo" src="QuimeraCreativa-Blanco.png" alt="Quimera Creativa"><span><strong>Equipo Quimera</strong><small>BETA 1.4 · CONTROL DE PRODUCCIÓN</small></span></div><div class="top-actions"><span class="user" id="userLabel"></span><button id="usersBtn" class="top-action hidden" onclick="openUserAdmin()">Usuarios</button><button id="refreshBtn" class="top-action hidden" onclick="refreshCurrent()">↻ Actualizar</button><button id="logoutBtn" class="top-action hidden" onclick="logout()">Salir</button></div></header>
  <div id="offlineBanner" class="offline hidden">Sin conexión. No escanees ni confirmes movimientos hasta recuperar internet.</div>
  <section id="loginView" class="login"><div class="card"><img class="login-logo" src="QuimeraCreativa-Blanco.png" alt="Quimera Creativa"><p class="eyebrow">CONTROL DE EQUIPO</p><h1>Bodega Quimera</h1><p>Ingresa con tu correo de Quimera y tu contraseña.</p><form onsubmit="passwordLogin(event)" style="text-align:left"><label>Correo<input id="loginEmail" type="email" autocomplete="username" required placeholder="nombre@quimeracreativa.mx"></label><label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password" required minlength="8" maxlength="20"></label><label style="font-weight:600"><input id="rememberLogin" type="checkbox" checked style="width:auto;margin-right:7px">Mantener sesión iniciada por 30 días</label><button id="passwordLoginBtn" class="btn primary" style="margin-top:16px">Ingresar</button></form><details style="margin-top:18px;text-align:left"><summary class="muted" style="cursor:pointer;font-size:12px">Acceso administrativo temporal</summary><div id="googleButton"></div></details><div id="loginMessage" class="message error hidden"></div></div></section>
  <main id="app" class="shell hidden"><div id="view"></div></main>
  <nav id="nav" class="bottomnav hidden">
    <button class="navbtn active" data-view="home" onclick="navigate('home')"><span>⌂</span>Inicio</button>
    <button class="navbtn" data-view="productions" onclick="navigate('productions')"><span>📷</span>Producciones</button>
    <button class="navbtn" data-view="inventory" onclick="navigate('inventory')"><span>⌕</span>Inventario</button>
    <button class="navbtn" data-view="people" onclick="navigate('people')"><span>♙</span>Personal</button>
    <button class="navbtn" data-view="incidents" onclick="navigate('incidents')"><span>!</span>Incidencias</button>
    <button class="navbtn" data-view="history" onclick="navigate('history')"><span>📖</span>Historial</button>
  </nav>
  <div id="modal" class="overlay hidden"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">Cerrar</button></div><div id="modalBody"></div></div></div>
  <iframe name="apiFrame" id="apiFrame" class="hidden"></iframe>
  <script>
    const CONFIG={
      API:'https://script.google.com/macros/s/AKfycbzgsnFdU-1zqTpU3O_5kUUyM-cVVBWgzYS-6aMPVOGu1GcLCWGcAFcwOkRTgfvpFmgPTA/exec',
      CLIENT_ID:'296686834169-gsadmi2mklm1tplf4acpf41s81chag6k.apps.googleusercontent.com'
    };
    const S={token:'',data:null,detail:null,view:'home',scanner:null,scanning:false,scanBusy:false,pendingOps:0,pending:new Map(),navFrame:0,areaFilter:'Todos',syncing:false};
    const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    window.addEventListener('load',()=>{updateOnlineStatus();setInterval(silentSyncProduction,12000);const saved=localStorage.getItem('quimeraToken')||sessionStorage.getItem('quimeraToken');if(saved){S.token=saved;if(!tokenExpired())resumeSession();else clearSavedSession()}const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);google.accounts.id.initialize({client_id:CONFIG.CLIENT_ID,callback:onGoogle,ux_mode:'popup'});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',locale:'es',width:300})}},150)});
    window.addEventListener('online',updateOnlineStatus);window.addEventListener('offline',updateOnlineStatus);
    async function onGoogle(response){S.token=response.credential;sessionStorage.setItem('quimeraToken',S.token);await resumeSession()}
    async function passwordLogin(event){event.preventDefault();const button=$('passwordLoginBtn');button.disabled=true;button.textContent='Ingresando…';$('loginMessage').classList.add('hidden');try{const remember=$('rememberLogin').checked,result=await publicApi('passwordLogin',{email:$('loginEmail').value.trim(),password:$('loginPassword').value,remember});S.token=result.token;saveSessionToken(result.token,remember);await resumeSession()}catch(e){loginError(e.message)}finally{button.disabled=false;button.textContent='Ingresar'}}
    async function resumeSession(){try{const session=await api('session',{});showApp(session.user);const cached=readCachedData(session.user.email);if(cached){S.data=cached;navigate('home')}else showLoading(true);S.data=await api('bootstrap',{});cacheData();navigate(S.view==='production'?'home':S.view);if(session.mustChange)openPasswordChange(true)}catch(e){logout(e.message)}}
    function showApp(user){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('refreshBtn').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('usersBtn').classList.toggle('hidden',!['ADMIN','ADMINISTRADOR'].includes(state(user.permission)));$('userLabel').textContent=user.name+' · '+user.permission}
    function cacheData(){try{sessionStorage.setItem('quimeraData',JSON.stringify({email:S.data.user.email,data:S.data}))}catch(e){}}
    function readCachedData(email){try{const cached=JSON.parse(sessionStorage.getItem('quimeraData')||'null');return cached&&String(cached.email).toLowerCase()===String(email).toLowerCase()?cached.data:null}catch(e){return null}}
    function api(action,payload){if(!S.token)return Promise.reject(new Error('La sesión terminó. Inicia sesión nuevamente.'));if(tokenExpired()){const error=new Error('La sesión terminó. Inicia sesión nuevamente.');logout(error.message);return Promise.reject(error)}return requestApi(action,payload,S.token)}
    function publicApi(action,payload){return requestApi(action,payload,'')}
    function requestApi(action,payload,token){if(!navigator.onLine)return Promise.reject(new Error('Sin conexión a internet. El movimiento no se registró.'));return new Promise((resolve,reject)=>{const requestId='r'+Date.now()+Math.random().toString(16).slice(2),callback='quimeraCallback_'+requestId,script=document.createElement('script');const cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove()};window[callback]=msg=>{cleanup();if(msg.ok)resolve(msg.data);else reject(new Error(msg.error||'Error del servidor'))};const params=new URLSearchParams({action,token,payload:JSON.stringify(payload),requestId,callback});script.src=CONFIG.API+'?'+params.toString();script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con el servidor. El movimiento no se registró.'))};const timer=setTimeout(()=>{cleanup();reject(new Error('El servidor tardó demasiado. El movimiento no se confirmó.'))},30000);document.body.appendChild(script)})}
    function showLoading(force=false){if(!force&&!$('loginView').classList.contains('hidden'))return;$('view').innerHTML='<div class="loader"><div><div class="spinner"></div>Cargando información…</div></div>';}
    function loginError(text){$('loginMessage').textContent=text;$('loginMessage').classList.remove('hidden')}
    function navigate(view){if(S.scanning)stopScanner();S.view=view;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const render=({home:renderHome,productions:renderProductions,inventory:renderInventory,people:renderPeople,incidents:renderIncidents,history:renderHistory}[view]||renderHome);cancelAnimationFrame(S.navFrame);S.navFrame=requestAnimationFrame(()=>{render();window.scrollTo(0,0)})}
    function renderHome(){const d=S.data,active=d.activeProductions||[],available=(d.inventory||[]).filter(i=>state(i.Estado)==='DISPONIBLE').length,out=(d.inventory||[]).filter(i=>['EN_PRODUCCION','PREPARANDO_SALIDA','REVISION_LOCACION'].includes(state(i.Estado))).length;$('view').innerHTML=`<section class="card hero"><p class="eyebrow">PANEL GENERAL</p><h1>Control de equipo,<br>${esc(firstName(d.user.name))}.</h1><p class="muted">Revisa las producciones activas, devoluciones e incidencias.</p><button class="btn primary" onclick="openCreate()">＋ Nueva producción</button></section><div class="section-head"><h2>Resumen</h2></div><div class="grid"><div class="stat"><strong>${active.length}</strong><small>Producciones activas</small></div><div class="stat"><strong>${available}</strong><small>Equipos disponibles</small></div><div class="stat"><strong>${out}</strong><small>Fuera de bodega</small></div><div class="stat"><strong>${(d.openIncidents||[]).length}</strong><small>Incidencias abiertas</small></div></div><div class="section-head"><h2>Producciones activas</h2><span onclick="navigate('productions')">Ver todas</span></div>${productionList(active)}`}
    function renderProductions(){$('view').innerHTML=`<section class="card hero"><p class="eyebrow">PRODUCCIONES</p><h1>Salidas activas</h1><p class="muted">Preparación, revisión en locación y regreso a bodega.</p><button class="btn primary" onclick="openCreate()">＋ Nueva producción</button></section><div class="section-head"><h2>Activas</h2><span>${S.data.activeProductions.length}</span></div>${productionList(S.data.activeProductions)}`}
    function productionList(items){return items.length?`<div class="card list">${items.map(p=>`<div class="row" onclick="openProduction('${esc(p.IDProduccion)}')"><div class="row-main"><strong>${esc(p.Nombre)}</strong><small>${esc(p.Folio)} · ${esc(p.Cliente||'Sin cliente')} · ${esc(p.FechaRegreso)}</small></div>${tag(p.Estado)}</div>`).join('')}</div>`:`<div class="card empty"><strong>No hay registros</strong>Crea una producción para comenzar.</div>`}
    function renderInventory(){$('view').innerHTML=`<section class="card"><p class="eyebrow">INVENTARIO</p><h1>Equipo</h1><input id="inventorySearch" type="search" autocomplete="off" placeholder="Buscar ID, equipo, marca o modelo" oninput="filterInventory(this.value)"></section><div class="section-head"><h2>Resultados</h2><span id="inventoryCount">0</span></div><div id="inventoryList" class="card list"></div>`;filterInventory('')}
    function filterInventory(filter){const term=String(filter||'').trim().toLowerCase(),items=(S.data.inventory||[]).filter(i=>(i.ID+' '+i.Equipo+' '+i.Marca+' '+i.Modelo+' '+i.Categoria+' '+field(i,'AreaOperativa')).toLowerCase().includes(term)),visible=items.slice(0,120);$('inventoryCount').textContent=items.length;$('inventoryList').innerHTML=visible.map(i=>`<div class="row"><div class="row-main"><strong>${esc(i.ID)} · ${esc(i.Equipo)}</strong><small>${esc([canonicalArea(field(i,'AreaOperativa'))||'Compartido',i.Marca,i.Modelo,i.Condicion].filter(Boolean).join(' · '))}</small></div>${tag(i.Estado)}</div>`).join('')||'<div class="empty">No se encontró equipo.</div>';if(items.length>visible.length)$('inventoryList').insertAdjacentHTML('beforeend',`<div class="empty">Mostrando los primeros ${visible.length}. Usa el buscador para encontrar el resto.</div>`)}
    function renderPeople(){const active=S.data.activeProductions||[],members=S.data.productionMembers||[],people=S.data.people||[];$('view').innerHTML=`<section class="card hero"><p class="eyebrow">PERSONAL</p><h1>Disponibilidad</h1><p class="muted">Consulta quién está libre o asignado a una producción activa.</p>${isAdmin()?'<button class="btn primary" style="margin-top:18px" onclick="openAddPerson()">＋ Agregar persona</button>':''}</section><div class="section-head"><h2>Personal</h2><span>${people.length}</span></div><div class="card list">${people.map(person=>{const assignments=members.filter(m=>String(m.IDPersonal)===String(person.IDPersonal)).map(m=>{const p=active.find(x=>String(x.IDProduccion)===String(m.IDProduccion));return p?{p,m}:null}).filter(Boolean);return`<div class="row"><div class="row-main"><strong>${esc(person.Nombre)}</strong><small>${assignments.length?assignments.map(a=>esc(a.p.Nombre+' · '+a.m.Rol)).join('<br>'):esc([person.RolPrincipal,person.Correo].filter(Boolean).join(' · ')||'Sin rol principal')}</small></div>${assignments.length?'<span class="tag amber">Ocupado</span>':'<span class="tag green">Libre</span>'}</div>`}).join('')||'<div class="empty">No hay personal registrado.</div>'}</div>`}
    function isAdmin(){return ['ADMIN','ADMINISTRADOR'].includes(state(S.data?.user?.permission))}
    function openAddPerson(){if(!isAdmin())return alert('Solo administración puede agregar personal.');openModal('Agregar persona',`<form onsubmit="submitAddPerson(event)"><label>Nombre completo<input id="personName" required autocomplete="name" placeholder="Nombre y apellidos"></label><label>Rol principal<select id="personRole" required>${roles('')}</select></label><label>Área operativa<select id="personArea">${areas('General')}</select></label><label>Correo de Quimera<input id="personEmail" type="email" autocomplete="email" placeholder="nombre@quimeracreativa.mx"></label><label>Teléfono<input id="personPhone" type="tel" autocomplete="tel" placeholder="Opcional"></label><label>Notas<textarea id="personNotes" placeholder="Información opcional"></textarea></label><button id="addPersonBtn" class="btn primary" style="margin-top:18px">Guardar persona</button></form>`)}

    function renderIncidents(){const items=S.data.openIncidents||[];$('view').innerHTML=`<section class="card hero"><p class="eyebrow">INCIDENCIAS</p><h1>Seguimiento</h1><p class="muted">Equipo faltante, dañado, incompleto o en mantenimiento.</p></section><div class="section-head"><h2>Abiertas</h2><span>${items.length}</span></div><div class="card list">${items.map(i=>`<div class="row"><div class="row-main"><strong>${esc(i.IDEquipo)} · ${esc(i.TipoIncidencia)}</strong><small>${esc(i.Descripcion||'Sin descripción')} · ${esc(i.FechaHora)}</small></div><button class="mini gray" onclick="openResolveIncident('${esc(i.IDIncidencia)}')">Resolver</button></div>`).join('')||'<div class="empty"><strong>Sin incidencias abiertas</strong>Todo se encuentra en orden.</div>'}</div>`}
    function renderHistory(){$('view').innerHTML=`<section class="card hero"><p class="eyebrow">HISTORIAL</p><h1>Producciones cerradas</h1><p class="muted">Consulta responsables, integrantes, equipo e incidencias.</p></section><div class="section-head"><h2>Finalizadas</h2><span>${S.data.history.length}</span></div>${productionList(S.data.history)}`}
    function openCreate(){const people=S.data.people||[];openModal('Nueva producción',`<form onsubmit="createProduction(event)"><label>Nombre de la producción<input id="pName" required placeholder="Ej. Dreams Cozumel"></label><label>Cliente<input id="pClient" placeholder="Ej. Hotel Dreams"></label><label>Locación<input id="pLocation" placeholder="Ej. Cozumel"></label><label>Responsable del equipo<input id="pResponsible" required value="${esc(S.data.user.name)}" placeholder="Nombre completo"></label><div class="two"><label>Fecha de salida<input id="pDeparture" type="date" required></label><label>Fecha de regreso<input id="pReturn" type="date" required></label></div><label>Integrantes y área operativa</label><div class="members">${people.map((p,n)=>`<div class="member"><input type="checkbox" id="m${n}" data-id="${esc(p.IDPersonal)}" data-name="${esc(p.Nombre)}"><label for="m${n}" style="margin:0">${esc(p.Nombre)}<small class="muted">${esc(p.RolPrincipal||'')}</small></label><select id="r${n}" aria-label="Rol">${roles(p.RolPrincipal)}</select><select id="a${n}" aria-label="Área">${areas(areaForRole(p.RolPrincipal))}</select></div>`).join('')||'<div class="empty">No hay personal registrado.</div>'}</div><label>Notas<textarea id="pNotes" placeholder="Indicaciones generales"></textarea></label><button class="btn primary" id="createBtn" style="margin-top:18px">Crear producción</button></form>`)}
    async function createProduction(e){e.preventDefault();const button=$('createBtn');button.disabled=true;button.textContent='Creando…';const members=[...document.querySelectorAll('.member input:checked')].map(box=>{const n=box.id.slice(1);return{idPersonal:box.dataset.id,name:box.dataset.name,type:$('a'+n).value,role:$('r'+n).value}});try{const detail=await api('createProduction',{name:$('pName').value,client:$('pClient').value,location:$('pLocation').value,responsible:$('pResponsible').value,departureDate:$('pDeparture').value,returnDate:$('pReturn').value,notes:$('pNotes').value,members});syncProduction(detail.production,detail.members);S.detail=detail;S.areaFilter=defaultAreaFilter(detail.areaStatus);closeModal();renderProductionDetail();window.scrollTo(0,0)}catch(err){alert(err.message);button.disabled=false;button.textContent='Crear producción'}}
    function openEditProduction(){const p=S.detail.production,selected=S.detail.members||[],people=S.data.people||[];openModal('Editar producción',`<form onsubmit="submitEditProduction(event)"><label>Nombre<input id="eName" required value="${esc(p.Nombre)}"></label><label>Cliente<input id="eClient" value="${esc(p.Cliente)}"></label><label>Locación<input id="eLocation" value="${esc(p.Locacion)}"></label><label>Responsable<input id="eResponsible" required value="${esc(p.Responsable)}"></label><div class="two"><label>Fecha de salida<input id="eDeparture" type="date" required value="${esc(p.FechaSalida)}"></label><label>Fecha de regreso<input id="eReturn" type="date" required value="${esc(p.FechaRegreso)}"></label></div><label>Integrantes y área operativa</label><div class="members">${people.map((person,n)=>{const existing=selected.find(m=>String(m.IDPersonal)===String(person.IDPersonal));return`<div class="member"><input type="checkbox" id="em${n}" data-id="${esc(person.IDPersonal)}" data-name="${esc(person.Nombre)}" ${existing?'checked':''}><label for="em${n}" style="margin:0">${esc(person.Nombre)}</label><select id="er${n}" aria-label="Rol">${roles(existing?.Rol||person.RolPrincipal)}</select><select id="ea${n}" aria-label="Área">${areas(existing?.Tipo||areaForRole(person.RolPrincipal))}</select></div>`}).join('')}</div><label>Notas<textarea id="eNotes">${esc(p.Notas)}</textarea></label><button class="btn primary" style="margin-top:18px">Guardar cambios</button></form>`)}
    async function submitEditProduction(e){e.preventDefault();const members=[...document.querySelectorAll('.member input:checked')].map(box=>{const n=box.id.replace('em','');return{idPersonal:box.dataset.id,name:box.dataset.name,type:$('ea'+n).value,role:$('er'+n).value}});try{S.detail=await api('updateProduction',{idProduction:S.detail.production.IDProduccion,name:$('eName').value,client:$('eClient').value,location:$('eLocation').value,responsible:$('eResponsible').value,departureDate:$('eDeparture').value,returnDate:$('eReturn').value,notes:$('eNotes').value,members});syncProduction(S.detail.production,S.detail.members);S.areaFilter=defaultAreaFilter(S.detail.areaStatus);closeModal();renderProductionDetail()}catch(e){alert(e.message)}}
    function openCancelProduction(){openModal('Cancelar producción',`<p>La producción pasará al historial y el equipo preparado volverá a estar disponible.</p><label>Motivo obligatorio<textarea id="cancelNotes" placeholder="Ej. Producción cancelada por el cliente"></textarea></label><div id="cancelError" class="message error hidden"></div><button id="cancelProductionBtn" type="button" class="btn danger" style="width:100%;margin-top:18px" onclick="submitCancelProduction()">Sí, cancelar producción</button>`)}
    async function submitCancelProduction(){const notes=$('cancelNotes').value.trim(),button=$('cancelProductionBtn'),error=$('cancelError');if(!notes){error.textContent='Escribe el motivo de cancelación.';error.classList.remove('hidden');$('cancelNotes').focus();return}error.classList.add('hidden');button.disabled=true;button.textContent='Cancelando…';try{const canceled=await api('cancelProduction',{idProduction:S.detail.production.IDProduccion,notes});syncProduction(canceled,[]);S.detail=null;closeModal();navigate('history')}catch(e){error.textContent=e.message;error.classList.remove('hidden');button.disabled=false;button.textContent='Sí, cancelar producción'}}
    async function refresh(){S.data=await api('bootstrap',{});cacheData()}
    function syncProduction(production,members){if(!production||!S.data)return;const id=String(production.IDProduccion),closed=['FINALIZADA','CANCELADA'].includes(state(production.Estado));S.data.activeProductions=(S.data.activeProductions||[]).filter(p=>String(p.IDProduccion)!==id);S.data.history=(S.data.history||[]).filter(p=>String(p.IDProduccion)!==id);(closed?S.data.history:S.data.activeProductions).unshift(production);if(members){S.data.productionMembers=(S.data.productionMembers||[]).filter(m=>String(m.IDProduccion)!==id).concat(members)}}
    function syncDetail(detail){if(!detail||!S.data)return;syncProduction(detail.production,detail.members);const id=String(detail.production.IDProduccion);S.data.openIncidents=(S.data.openIncidents||[]).filter(i=>String(i.IDProduccion)!==id).concat((detail.incidents||[]).filter(i=>state(i.EstadoIncidencia)!=='RESUELTA'))}
    function mergeServerDetail(detail){if(!detail)return;const pending=(S.detail?.equipment||[]).filter(x=>state(x.record?.EstadoEquipo)==='GUARDANDO'&&!(detail.equipment||[]).some(y=>String(y.record.IDEquipo).toUpperCase()===String(x.record.IDEquipo).toUpperCase()));S.detail=detail;S.detail.equipment=(detail.equipment||[]).concat(pending);syncDetail(detail)}
    function updateAreaProgress(){if($('areaProgress')&&S.detail)$('areaProgress').innerHTML=areaProgressCard(S.detail.areaStatus,state(S.detail.production.Estado))}
    async function setAreaReady(area,ready){if(S.pendingOps>0)return alert('Espera a que termine de guardarse el equipo pendiente.');try{const detail=await api('setAreaReady',{idProduction:S.detail.production.IDProduccion,area,ready});mergeServerDetail(detail);updateAreaProgress();updateEquipmentUI()}catch(e){alert(e.message)}}
    async function silentSyncProduction(){if(S.syncing||!navigator.onLine||!S.token||S.view!=='production'||!S.detail?.production||S.pendingOps>0||tokenExpired())return;S.syncing=true;try{const detail=await api('productionDetail',{idProduction:S.detail.production.IDProduccion});mergeServerDetail(detail);updateEquipmentUI();updateAreaProgress()}catch(e){}finally{S.syncing=false}}
    async function refreshCurrent(){const button=$('refreshBtn');button.disabled=true;button.textContent='Actualizando…';try{if(S.detail&&S.detail.production&&S.view==='production'){const id=S.detail.production.IDProduccion,[data,detail]=await Promise.all([api('bootstrap',{}),api('productionDetail',{idProduction:id})]);S.data=data;S.detail=detail;renderProductionDetail()}else{await refresh();navigate(S.view)}button.textContent='✓ Actualizado';setTimeout(()=>button.textContent='↻ Actualizar',1200)}catch(e){alert(e.message);button.textContent='↻ Actualizar'}finally{button.disabled=false}}
    function logout(message=''){stopScanner();S.token='';S.data=null;S.detail=null;clearSavedSession();sessionStorage.removeItem('quimeraData');if(window.google?.accounts?.id)google.accounts.id.disableAutoSelect();$('app').classList.add('hidden');$('nav').classList.add('hidden');$('refreshBtn').classList.add('hidden');$('usersBtn').classList.add('hidden');$('logoutBtn').classList.add('hidden');$('loginView').classList.remove('hidden');$('userLabel').textContent='';if(message)loginError(message);else $('loginMessage').classList.add('hidden')}
    function saveSessionToken(token,remember){clearSavedSession();(remember?localStorage:sessionStorage).setItem('quimeraToken',token)}
    function clearSavedSession(){localStorage.removeItem('quimeraToken');sessionStorage.removeItem('quimeraToken')}
    function tokenExpired(){try{const body=JSON.parse(atob(S.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))),exp=Number(body.exp||0);return Date.now()>(exp>1e12?exp:exp*1000)-20000}catch(e){return true}}
    function openPasswordChange(required=false){openModal(required?'Crea tu nueva contraseña':'Cambiar contraseña',`<p class="muted">Usa entre 8 y 20 caracteres. Puedes combinar letras, números y símbolos.</p><form onsubmit="submitPasswordChange(event,${required})"><label>Nueva contraseña<input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="20" required></label><label>Confirmar contraseña<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="20" required></label><button id="changePasswordBtn" class="btn primary" style="margin-top:18px">Guardar contraseña</button></form>`);if(required)$('modal').querySelector('.close').classList.add('hidden')}
    async function submitPasswordChange(event,required){event.preventDefault();const password=$('newPassword').value;if(password!==$('confirmPassword').value)return alert('Las contraseñas no coinciden.');const button=$('changePasswordBtn');button.disabled=true;button.textContent='Guardando…';try{const remember=Boolean(localStorage.getItem('quimeraToken')),result=await api('changePassword',{newPassword:password,remember});S.token=result.token;saveSessionToken(result.token,remember);$('modal').querySelector('.close').classList.remove('hidden');closeModal();alert('Tu contraseña quedó guardada.')}catch(e){alert(e.message);button.disabled=false;button.textContent='Guardar contraseña'}}
    async function openUserAdmin(){openModal('Usuarios y contraseñas','<div class="loader" style="min-height:180px"><div><div class="spinner"></div>Cargando usuarios…</div></div>');try{renderUserAdmin(await api('listUsers',{}))}catch(e){$('modalBody').innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
    function renderUserAdmin(users){$('modalBody').innerHTML=`<p class="muted">La primera vez asigna una contraseña temporal. La persona tendrá que cambiarla al ingresar.</p><div class="members">${users.map((u,n)=>`<div class="condition-item"><strong>${esc(u.name||u.email)}</strong><small>${esc(u.email)} · ${esc(u.permission)} · ${u.active?'Activo':'Inactivo'} · ${u.configured?'Contraseña configurada':'Sin contraseña'}</small><label>Nueva contraseña temporal<input id="tempPassword${n}" type="password" minlength="8" maxlength="20" placeholder="8 a 20 caracteres"></label><button class="mini red" style="margin-top:9px" onclick="setTemporaryPassword(${n},'${esc(u.email)}')">${u.configured?'Restablecer':'Crear contraseña'}</button></div>`).join('')}</div>`}
    async function setTemporaryPassword(index,email){const password=$('tempPassword'+index).value;if(password.length<8||password.length>20)return alert('La contraseña debe tener entre 8 y 20 caracteres.');if(!confirm('¿Asignar esta contraseña temporal a '+email+'? Las sesiones anteriores se cerrarán.'))return;try{renderUserAdmin(await api('adminSetTemporaryPassword',{email,password}));alert('Contraseña temporal guardada.')}catch(e){alert(e.message)}}
    function updateOnlineStatus(){$('offlineBanner').classList.toggle('hidden',navigator.onLine);if($('refreshBtn'))$('refreshBtn').disabled=!navigator.onLine}
    async function openProduction(id){showLoading();try{S.detail=await api('productionDetail',{idProduction:id});S.areaFilter=defaultAreaFilter(S.detail.areaStatus);renderProductionDetail();window.scrollTo(0,0)}catch(e){alert(e.message);navigate('productions')}}
    function renderProductionDetail(){const d=S.detail,p=d.production,equipment=d.equipment||[],st=state(p.Estado),visible=filteredEquipment(equipment);S.view='production';const counts=stageCounts(st,equipment),manager=Boolean(d.areaStatus?.canManage);$('view').innerHTML=`<button class="back" onclick="navigate('${['FINALIZADA','CANCELADA'].includes(st)?'history':'productions'}')">← Volver</button><section class="card"><p class="eyebrow">${esc(p.Folio)} · ${labelState(p.Estado)}</p><h1>${esc(p.Nombre)}</h1><p class="meta">${esc(p.Cliente||'Sin cliente')} · ${esc(p.Locacion||'Sin locación')}<br>Responsable: ${esc(p.Responsable)}</p><div class="dates"><div class="date"><small>SALIDA</small><strong>${esc(p.FechaSalida)}</strong></div><div class="date"><small>REGRESO</small><strong>${esc(p.FechaRegreso)}</strong></div></div>${st==='PREPARACION'&&manager?'<div class="actions"><button class="btn light" onclick="openEditProduction()">Editar</button><button class="btn danger" onclick="openCancelProduction()">Cancelar</button></div>':''}</section>${membersCard(d.members)}<div id="areaProgress">${areaProgressCard(d.areaStatus,st)}</div>${stageCard(st,counts,equipment,d.areaStatus)}${destinationSummary(equipment)}<div class="section-head"><h2>Equipo</h2><span id="equipmentCount">${visible.length} / ${equipment.length}</span></div>${areaFilterControl(d.areaStatus)}<div id="equipmentContainer" class="card list">${equipmentRows(st,visible)}</div>${d.incidents.length?`<div class="section-head"><h2>Incidencias</h2><span>${d.incidents.length}</span></div><div class="card list">${d.incidents.map(i=>`<div class="row"><div><strong>${esc(i.IDEquipo)} · ${esc(i.TipoIncidencia)}</strong><small>${esc(i.Descripcion)}</small></div>${tag(i.EstadoIncidencia)}</div>`).join('')}</div>`:''}`}
    function membersCard(members){return members?.length?`<div class="section-head"><h2>Integrantes</h2><span>${members.length}</span></div><div class="card list">${members.map(m=>`<div class="row"><div><strong>${esc(m.Nombre)}</strong><small>${esc(m.Rol)} · Área ${esc(m.Tipo||'General')}</small></div></div>`).join('')}</div>`:''}
    function areaProgressCard(status,st){if(!status?.collaborative||st!=='PREPARACION')return'';return`<div class="section-head"><h2>Preparación por áreas</h2><span>Sincronización automática</span></div><section class="card"><div class="area-grid">${(status.areas||[]).map(a=>{const allowed=status.canManage||(status.myAreas||[]).includes(a.area)||a.area==='Compartido';return`<div class="area-row"><div><strong>${esc(a.area)}</strong><small>${a.total} equipos · ${a.ready?'Lista por '+esc(a.readyBy):'Pendiente'}</small></div><div class="area-controls">${a.ready?'<span class="tag green">Lista</span>':'<span class="tag amber">Pendiente</span>'}${allowed?`<button class="mini ${a.ready?'gray':'green'}" onclick="setAreaReady('${esc(a.area)}',${a.ready?'false':'true'})">${a.ready?'Reabrir':'Mi área está lista'}</button>`:''}</div></div>`}).join('')}</div><p class="sync-note">Los cambios realizados desde otros teléfonos aparecen automáticamente.</p></section>`}
    function stageCard(st,c,equipment,areaStatus){if(st==='FINALIZADA')return`<section class="card scanbox"><h2>Producción finalizada</h2><p class="meta">Este registro se conserva en el historial.</p></section>`;const manager=Boolean(areaStatus?.canManage),active=['EN_PRODUCCION','REVISION_LOCACION','REGRESO_BODEGA'].includes(st);let title='Preparación de salida',text='Escanea el equipo de tu área. Los cambios de otros integrantes se sincronizan automáticamente.',button='';if(st==='PREPARACION'&&manager)button=`<button class="btn success" onclick="confirmDeparture()" ${equipment.length?'':'disabled'}>Confirmar salida</button>`;if(active){title='Cerrar jornada / distribuir equipo';text='Selecciona varias piezas y registra dónde quedan. No es necesario regresar todo a bodega.';button=`<button class="btn primary" onclick="openDistribution()">Distribuir equipo</button>${manager?`<button class="btn success" onclick="finalizeProduction()">Finalizar producción</button>`:''}`}return`<section class="card scanbox"><h2>${title}</h2><p class="meta">${text}</p>${st==='PREPARACION'?`<button id="scanBtn" class="btn blue" onclick="toggleScanner()">▣ Abrir escáner QR</button><div id="reader" class="hidden"></div><div class="manual"><input id="manualCode" placeholder="Código manual: CAM-001"><button class="btn dark" onclick="manualScan()">Agregar</button></div><div id="scanMessage" class="message hidden"></div>`:''}${st==='PREPARACION'&&equipment.length?'<button class="btn light" style="width:100%;margin-top:12px" onclick="openDepartureReview()">Revisar condiciones y notas</button>':''}<div class="actions">${button}</div></section>`}
    function equipmentRows(st,items){return items.length?items.map(x=>{const r=x.record,i=x.item,status=equipmentStageStatus(st,r),missing=state(r.EstadoEquipo)==='FALTANTE',area=canonicalArea(field(i,'AreaOperativa'))||'Compartido',place=r.DestinoActual||i.UbicacionActual||status.text;return`<div class="equip-row"><span class="icon">${missing?'!':status.done?'✓':'·'}</span><div><strong>${esc(r.IDEquipo)} · ${esc(i.Equipo||'')}</strong><small>${esc([area,i.Marca,i.Modelo,place,r.CustodioActual?'con '+r.CustodioActual:'',r.RegistradoPor?'por '+r.RegistradoPor:''].filter(Boolean).join(' · '))}</small></div><div class="mini-actions">${st==='PREPARACION'?`<button class="mini red" onclick="removeEquipment('${esc(r.IDEquipo)}')">Quitar</button>`:`<button class="mini gray" onclick="openIncident('${esc(r.IDEquipo)}')">Incidencia</button>`}</div></div>`}).join(''):'<div class="empty"><strong>Sin equipo en esta vista</strong>Escanea una pieza o cambia el filtro de área.</div>'}
    function stageCounts(st,items){return{total:items.length,done:items.filter(x=>equipmentStageStatus(st,x.record).done).length}}
    function equipmentStageStatus(st,r){if(state(r.EstadoEquipo)==='GUARDANDO')return{done:false,text:'Guardando…'};if(st==='PREPARACION')return{done:true,text:r.CondicionSalida||'Registrado'};const final=['BODEGA','DEVUELTO','TRANSFERIDO','MANTENIMIENTO','FALTANTE'].includes(state(r.EstadoEquipo));return{done:final,text:r.DestinoActual||r.EstadoEquipo}}
    function destinationSummary(items){const counts={};items.forEach(x=>{const destination=x.record.DestinoActual||'Sin destino';counts[destination]=(counts[destination]||0)+1});if(!items.length)return'';return`<div class="section-head"><h2>Ubicación actual</h2><span>${items.length} piezas</span></div><div class="grid">${Object.entries(counts).map(([name,count])=>`<div class="stat"><strong>${count}</strong><small>${esc(name)}</small></div>`).join('')}</div>`}
    function areaFilterControl(status){const available=['Todos',...(status?.areas||[]).map(a=>a.area)].filter((v,i,a)=>a.indexOf(v)===i);if(!available.includes(S.areaFilter))S.areaFilter='Todos';return`<div style="display:flex;justify-content:flex-end;margin:-4px 0 10px"><select class="area-filter" onchange="setAreaFilter(this.value)">${available.map(a=>`<option ${a===S.areaFilter?'selected':''}>${esc(a)}</option>`).join('')}</select></div>`}
    function defaultAreaFilter(status){if(status?.canManage)return'Todos';const own=(status?.myAreas||[]).find(a=>!['General','Compartido'].includes(a));return own||status?.myAreas?.[0]||'Todos'}
    function filteredEquipment(items){return S.areaFilter==='Todos'?items:items.filter(x=>(canonicalArea(field(x.item,'AreaOperativa'))||'Compartido')===S.areaFilter)}
    function setAreaFilter(area){S.areaFilter=area;updateEquipmentUI()}
    function updateEquipmentUI(){if(!$('equipmentContainer')||!S.detail)return;const st=state(S.detail.production.Estado),items=S.detail.equipment||[],visible=filteredEquipment(items);$('equipmentCount').textContent=visible.length+' / '+items.length;$('equipmentContainer').innerHTML=equipmentRows(st,visible)}
    async function handleCode(code){code=String(code||'').trim().toUpperCase();if(!code)return;const st=state(S.detail.production.Estado);if(st==='PREPARACION')return addPreparationEquipment(code);if(st==='REVISION_LOCACION')return conditionDialog(code,'reviewEquipment','Condición en locación');if(st==='REGRESO_BODEGA')return conditionDialog(code,'returnEquipment','Condición al regresar a bodega')}
    async function addPreparationEquipment(code){if((S.detail.equipment||[]).some(x=>String(x.record.IDEquipo).toUpperCase()===code))return showScanMessage(code+' ya está en esta producción.',true);const item=(S.data.inventory||[]).find(i=>String(i.ID).toUpperCase()===code);if(!item)return showScanMessage('No existe '+code+' en el inventario.',true);const optimistic={record:{IDEquipo:code,CondicionSalida:item.Condicion||'Buena',EstadoEquipo:'GUARDANDO',RegistradoPor:S.data.user.email},item};S.detail.equipment.push(optimistic);S.pendingOps++;updateEquipmentUI();showScanMessage(code+' · Guardando…');if(navigator.vibrate)navigator.vibrate(70);try{const saved=await api('addEquipment',{idProduction:S.detail.production.IDProduccion,idEquipment:code});mergeServerDetail(saved);showScanMessage(code+' guardado correctamente.')}catch(e){S.detail.equipment=(S.detail.equipment||[]).filter(x=>String(x.record.IDEquipo).toUpperCase()!==code);showScanMessage(e.message,true);silentSyncProduction()}finally{S.pendingOps=Math.max(0,S.pendingOps-1);updateEquipmentUI();updateAreaProgress()}}
    function openDepartureReview(){const items=filteredEquipment(S.detail.equipment||[]);openModal('Revisar condiciones',`<p class="muted">Solo modifica los equipos visibles en el filtro actual. Puedes cambiar varios y guardarlos juntos.</p><div class="members">${items.map((x,n)=>{const condition=x.record.CondicionSalida||x.item.Condicion||'Buena';return`<div class="condition-item" data-id="${esc(x.record.IDEquipo)}" data-original="${esc(condition)}"><strong>${esc(x.record.IDEquipo)} · ${esc(x.item.Equipo||'')}</strong><small>${esc([x.item.Marca,x.item.Modelo].filter(Boolean).join(' · '))}</small><label>Condición<select id="departureCondition${n}"><option ${condition==='Nueva'?'selected':''}>Nueva</option><option ${condition==='Buena'?'selected':''}>Buena</option><option ${condition==='Con detalles'?'selected':''}>Con detalles</option><option ${condition==='Dañada'?'selected':''}>Dañada</option><option ${condition==='Incompleta'?'selected':''}>Incompleta</option></select></label><label>Nota opcional<textarea id="departureNotes${n}" placeholder="Ej. Pequeña marca en el cristal"></textarea></label></div>`}).join('')||'<div class="empty">No hay equipo visible en esta área.</div>'}</div><button id="saveConditionsBtn" class="btn success" style="width:100%;margin-top:18px" onclick="saveDepartureReview()">Listo · guardar cambios</button>`)}
    async function saveDepartureReview(){const rows=[...document.querySelectorAll('.condition-item')],changes=[];rows.forEach((row,n)=>{const condition=$('departureCondition'+n).value,notes=$('departureNotes'+n).value.trim();if(condition!==row.dataset.original||notes)changes.push({idEquipment:row.dataset.id,condition,notes})});if(!changes.length){closeModal();return}const button=$('saveConditionsBtn');button.disabled=true;button.textContent='Guardando…';try{S.detail=await api('updateDepartureConditions',{idProduction:S.detail.production.IDProduccion,changes});syncDetail(S.detail);closeModal();renderProductionDetail()}catch(e){alert(e.message);button.disabled=false;button.textContent='Listo · guardar cambios'}}
    function conditionDialog(code,action,title){const item=(S.data.inventory||[]).find(i=>String(i.ID).toUpperCase()===code),current=item?.Condicion||'Buena';openModal(title,`<p><b>${esc(code)}</b> · ${esc(item?.Equipo||'')}</p><label>Condición<select id="condition"><option ${current==='Nueva'?'selected':''}>Nueva</option><option ${current==='Buena'?'selected':''}>Buena</option><option ${current==='Con detalles'?'selected':''}>Con detalles</option><option ${current==='Dañada'?'selected':''}>Dañada</option><option ${current==='Incompleta'?'selected':''}>Incompleta</option></select></label><label>Nota opcional<textarea id="conditionNotes"></textarea></label>${action!=='addEquipment'?'<label><input id="maintenance" type="checkbox" style="width:auto;margin-right:7px">Enviar a mantenimiento</label>':''}<button class="btn primary" style="margin-top:18px" onclick="submitCondition('${esc(code)}','${action}')">Confirmar</button>`)}
    async function submitCondition(code,action){const payload={idProduction:S.detail.production.IDProduccion,idEquipment:code,condition:$('condition').value,notes:$('conditionNotes').value,maintenance:$('maintenance')?.checked||false};closeModal();showScanMessage('Registrando…');try{S.detail=await api(action,payload);renderProductionDetail();if(navigator.vibrate)navigator.vibrate(100)}catch(e){alert(e.message);renderProductionDetail()}}
    async function removeEquipment(id){if(!confirm('¿Quitar '+id+' de esta producción?'))return;const index=(S.detail.equipment||[]).findIndex(x=>String(x.record.IDEquipo)===String(id));if(index<0)return;const removed=S.detail.equipment.splice(index,1)[0];S.pendingOps++;updateEquipmentUI();showScanMessage(id+' · Quitando…');try{await api('removeEquipment',{idProduction:S.detail.production.IDProduccion,idEquipment:id});showScanMessage(id+' se quitó correctamente.')}catch(e){S.detail.equipment.splice(Math.min(index,S.detail.equipment.length),0,removed);showScanMessage(e.message,true)}finally{S.pendingOps=Math.max(0,S.pendingOps-1);updateEquipmentUI()}}
    async function confirmDeparture(){if(S.pendingOps>0)return alert('Espera a que termine de guardarse o quitarse el equipo pendiente.');if(!confirm('¿Confirmar la salida? Después ya no podrás quitar equipo de la lista.'))return;await productionAction('confirmDeparture')}
    async function startLocationReview(){if(!confirm('Comenzarás la revisión antes de abandonar la locación.'))return;await productionAction('startLocationReview')}
    async function startWarehouseReturn(){const c=stageCounts('REVISION_LOCACION',S.detail.equipment);if(c.done<c.total&&!confirm(`Todavía faltan ${c.total-c.done} equipos por revisar. ¿Continuar de todos modos?`))return;await productionAction('startWarehouseReturn')}
    async function finalizeProduction(){if(!confirm('¿Finalizar y enviar esta producción al historial?'))return;await productionAction('finalizeProduction')}
    function openDistribution(){const items=filteredEquipment(S.detail.equipment||[]),current=S.detail.production.IDProduccion,targets=(S.data.activeProductions||[]).filter(p=>String(p.IDProduccion)!==String(current));openModal('Cerrar jornada / distribuir equipo',`<p class="muted">Marca las piezas que tendrán el mismo destino. Puedes repetir este proceso por grupos.</p><div class="actions"><button class="btn light" type="button" onclick="toggleDistribution(true)">Seleccionar todo</button><button class="btn light" type="button" onclick="toggleDistribution(false)">Quitar selección</button></div><div class="members">${items.map((x,n)=>`<div class="condition-item" style="display:grid;grid-template-columns:auto 1fr;gap:10px"><input class="distribution-check" type="checkbox" value="${esc(x.record.IDEquipo)}" style="width:auto;margin:3px 0"><div><strong>${esc(x.record.IDEquipo)} · ${esc(x.item.Equipo||'')}</strong><small>${esc([x.record.DestinoActual||'Sin destino',x.record.UbicacionActual,x.record.CustodioActual].filter(Boolean).join(' · '))}</small></div></div>`).join('')||'<div class="empty">No hay equipo visible en esta área.</div>'}</div><label>Destino<select id="distributionDestination" onchange="updateDistributionFields()"><option>Bodega</option><option>Locación</option><option>Vehículo</option><option>Con integrante</option><option>Siguiente producción</option><option>Mantenimiento</option><option>Faltante</option></select></label><div id="distributionTargetWrap" class="hidden"><label>Siguiente producción<select id="distributionTarget"><option value="">Seleccionar…</option>${targets.map(p=>`<option value="${esc(p.IDProduccion)}">${esc(p.Folio+' · '+p.Nombre)}</option>`).join('')}</select></label></div><label>Ubicación o referencia<input id="distributionLocation" placeholder="Ej. Camioneta 2, salón principal o bodega"></label><label>Custodio / integrante<input id="distributionCustodian" placeholder="Nombre de quien se queda con el equipo"></label><label>Condición<select id="distributionCondition"><option>Buena</option><option>Con detalles</option><option>Dañada</option><option>Incompleta</option></select></label><label>Nota opcional<textarea id="distributionNotes" placeholder="Ej. Se queda montado para continuar mañana"></textarea></label><button id="distributionBtn" class="btn primary" style="width:100%;margin-top:18px" onclick="submitDistribution()">Guardar destinos</button>`)}
    function toggleDistribution(checked){document.querySelectorAll('.distribution-check').forEach(input=>input.checked=checked)}
    function updateDistributionFields(){const next=state($('distributionDestination').value)==='SIGUIENTE_PRODUCCION';$('distributionTargetWrap').classList.toggle('hidden',!next)}
    async function submitDistribution(){const equipmentIds=[...document.querySelectorAll('.distribution-check:checked')].map(input=>input.value);if(!equipmentIds.length)return alert('Selecciona al menos un equipo.');const destination=$('distributionDestination').value,targetProduction=$('distributionTarget').value;if(state(destination)==='SIGUIENTE_PRODUCCION'&&!targetProduction)return alert('Selecciona la siguiente producción.');const button=$('distributionBtn');button.disabled=true;button.textContent='Guardando…';try{S.detail=await api('distributeEquipment',{idProduction:S.detail.production.IDProduccion,equipmentIds,destination,targetProduction,location:$('distributionLocation').value.trim(),custodian:$('distributionCustodian').value.trim(),condition:$('distributionCondition').value,notes:$('distributionNotes').value.trim()});syncDetail(S.detail);closeModal();renderProductionDetail()}catch(e){alert(e.message);button.disabled=false;button.textContent='Guardar destinos'}}
    async function productionAction(action){const previous=S.detail;showLoading();try{S.detail=await api(action,{idProduction:previous.production.IDProduccion});syncDetail(S.detail);renderProductionDetail()}catch(e){S.detail=previous;alert(e.message);renderProductionDetail()}}
    function openIncident(id){openModal('Reportar incidencia',`<p><b>${esc(id)}</b></p><label>Tipo<select id="incidentType"><option>Golpe o caída</option><option>Arena o humedad</option><option>Falla técnica</option><option>Accesorio faltante</option><option>Daño estético</option><option>Sobrecalentamiento</option><option>Otro</option></select></label><label>Condición actual<select id="incidentCondition"><option>Buena</option><option selected>Con detalles</option><option>Dañada</option><option>Incompleta</option></select></label><label>Descripción<textarea id="incidentNotes" required></textarea></label><label><input id="incidentMaintenance" type="checkbox" style="width:auto;margin-right:7px">Requiere mantenimiento</label><button class="btn danger" style="width:100%;margin-top:18px" onclick="submitIncident('${esc(id)}')">Guardar incidencia</button>`)}
    async function submitIncident(id){try{S.detail=await api('createIncident',{idProduction:S.detail.production.IDProduccion,idEquipment:id,incidentType:$('incidentType').value,condition:$('incidentCondition').value,notes:$('incidentNotes').value,maintenance:$('incidentMaintenance').checked,stage:S.detail.production.Estado});syncDetail(S.detail);closeModal();renderProductionDetail()}catch(e){alert(e.message)}}
    function openMarkMissing(id){openModal('Marcar equipo faltante',`<p><b>${esc(id)}</b></p><p class="muted">El equipo quedará bloqueado como faltante y se abrirá una incidencia.</p><label>Describe dónde se buscó o qué ocurrió<textarea id="missingNotes" placeholder="Nota obligatoria"></textarea></label><button class="btn danger" style="width:100%;margin-top:18px" onclick="submitMarkMissing('${esc(id)}')">Confirmar faltante</button>`)}
    async function submitMarkMissing(id){const notes=$('missingNotes').value.trim();if(!notes)return alert('Escribe una nota antes de marcar el equipo como faltante.');try{S.detail=await api('markMissing',{idProduction:S.detail.production.IDProduccion,idEquipment:id,notes});syncDetail(S.detail);closeModal();renderProductionDetail()}catch(e){alert(e.message)}}
    function openResolveIncident(id){const incident=(S.data.openIncidents||[]).find(i=>String(i.IDIncidencia)===String(id));openModal('Resolver incidencia',`<p><b>${esc(incident?.IDEquipo||'')}</b> · ${esc(incident?.TipoIncidencia||'')}</p><label>Resultado<select id="resolution"><option>Disponible</option><option>Mantenimiento</option><option>Baja</option></select></label><label>Condición final<select id="resolutionCondition"><option>Buena</option><option>Con detalles</option><option>Dañada</option><option>Incompleta</option></select></label><label>Nota de resolución<textarea id="resolutionNotes" placeholder="Ej. Se realizó limpieza y prueba de funcionamiento"></textarea></label><button class="btn success" style="width:100%;margin-top:18px" onclick="submitResolveIncident('${esc(id)}')">Resolver incidencia</button>`)}
    async function submitResolveIncident(id){const notes=$('resolutionNotes').value.trim();if(!notes)return alert('Escribe una nota de resolución.');try{S.data=await api('resolveIncident',{idIncident:id,resolution:$('resolution').value,condition:$('resolutionCondition').value,notes});closeModal();renderIncidents()}catch(e){alert(e.message)}}
    function manualScan(){const input=$('manualCode');handleCode(input.value);input.value=''}
    async function toggleScanner(){S.scanning?stopScanner():startScanner()}
    async function startScanner(){const reader=$('reader');reader.classList.remove('hidden');S.scanner=new Html5Qrcode('reader');try{await S.scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:230,height:230}},text=>{if(!S.scanning||S.scanBusy)return;const preparation=state(S.detail?.production?.Estado)==='PREPARACION';if(preparation){S.scanBusy=true;handleCode(text);setTimeout(()=>S.scanBusy=false,900)}else{stopScanner();handleCode(text)}},()=>{});S.scanning=true;$('scanBtn').textContent='Cerrar cámara'}catch(e){reader.classList.add('hidden');showScanMessage('No se pudo abrir la cámara. Revisa el permiso.',true)}}
    async function stopScanner(){if(S.scanner){try{await S.scanner.stop();S.scanner.clear()}catch(e){}S.scanner=null}S.scanning=false;S.scanBusy=false;if($('reader'))$('reader').classList.add('hidden');if($('scanBtn'))$('scanBtn').textContent='▣ Abrir escáner QR'}
    function showScanMessage(text,error=false){if(!$('scanMessage'))return;$('scanMessage').textContent=text;$('scanMessage').className='message'+(error?' error':'')}
    function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}
    function roles(selected){return['Producción','Dirección','Cámara','Foto','Asistencia','Drone','Iluminación','Audio','Arte','Otro'].map(r=>`<option ${r===selected?'selected':''}>${r}</option>`).join('')}
    function areas(selected){return['Foto','Video','Iluminacion','General','Compartido'].map(a=>`<option ${canonicalArea(selected)===a?'selected':''}>${a}</option>`).join('')}
    function areaForRole(role){const r=state(role);if(r.includes('FOTO'))return'Foto';if(r.includes('ILUMIN')||r.includes('GAFFER'))return'Iluminacion';if(r.includes('CAMARA')||r.includes('VIDEO')||r.includes('DRONE'))return'Video';return'General'}
    function canonicalArea(value){const r=String(value||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();if(r.includes('ILUMIN')||r.includes('GAFFER')||r.includes('FLASH')||r.includes('LUZ'))return'Iluminacion';if(r.includes('VIDEO')||r.includes('CAMARA')||r.includes('DRONE'))return'Video';if(r.includes('FOTO'))return'Foto';if(r.includes('COMPART'))return'Compartido';if(r.includes('GENERAL')||r.includes('PRODUC')||r.includes('DIREC'))return'General';return''}
    function field(object,name){const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase(),key=Object.keys(object||{}).find(k=>norm(k)===norm(name));return key?object[key]:''}
    function tag(value){const st=state(value),color=st.includes('DISPONIBLE')||st.includes('FINALIZADA')?'green':st.includes('MANTENIMIENTO')||st.includes('FALTANTE')||st.includes('INCIDENCIA')?'red':st.includes('PREPARACION')||st.includes('REVISION')?'amber':'blue';return`<span class="tag ${color}">${esc(labelState(value))}</span>`}
    function state(v){return String(v||'').trim().toUpperCase().replace(/\s+/g,'_').replace(/Ó/g,'O')}
    function labelState(v){return String(v||'').replace(/_/g,' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}
    function firstName(v){return String(v||'').trim().split(/\s+/)[0]||'equipo'}
  </script>
</body>
